<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D Viewer</title>
<link rel="stylesheet" href="/static/app.css">
<script src="https://cdn.tailwindcss.com/3.4.1"></script>
</head>
<body>
<main id="stage"></main>

<header class="fixed top-0 inset-x-0 h-12 glass z-20 flex items-center gap-2 px-3">
  <h1 id="title" class="truncate font-bold text-sm">Loading…</h1>
  <span class="flex-1"></span>
  <button class="btn" id="menuBtn" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu" style="min-width:44px;min-height:36px">
    <svg width="18" height="14" viewBox="0 0 18 14" aria-hidden="true"><path d="M1 1.5h16M1 7h16M1 12.5h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
  </button>
</header>

<nav id="menu" class="hidden fixed right-2 top-14 z-30 glass rounded-xl p-2 flex flex-col gap-1 w-56 overflow-y-auto" style="max-height:calc(100dvh - 4.5rem)" aria-label="View options">
  <div id="dl" class="hidden flex flex-col gap-1"><span class="text-xs text-slate-400 px-1">Download model</span></div>
  <button class="btn" id="rotate" title="Auto-rotate">Auto-rotate</button>
  <button class="btn" id="full" title="Fullscreen">Fullscreen</button>
  <p class="text-xs text-slate-500 px-1 pt-1"><a class="underline" href="/privacy" target="_blank" rel="noopener">Privacy</a> &middot; <a class="underline" href="/terms" target="_blank" rel="noopener">Terms</a></p>
</nav>

<div id="toast" class="hidden" role="status" aria-live="polite"></div>
<div id="pwModal" class="hidden fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="pwTitle">
  <form id="pwForm" class="glass rounded-2xl p-6 w-full max-w-sm flex flex-col gap-3">
    <h2 class="text-lg font-bold" id="pwTitle">This link is password protected</h2>
    <input class="inp" id="pwInput" type="password" autocomplete="off" required maxlength="64" aria-label="Password">
    <p class="text-xs text-red-400 hidden" id="pwErr" role="alert">Wrong password, try again.</p>
    <button class="btn btn-p">Open</button>
  </form>
</div>
<div id="err" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-slate-950 text-lg p-6 text-center" role="alert"></div>

<script type="module" src="/static/js/viewer.js"></script>
</body>
</html>
